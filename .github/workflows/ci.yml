name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Regenerate fixtures
        run: python test/make_fixtures.py
      - name: Detector tests
        run: python test/test_detect.py
      - name: Warp tests
        run: python test/test_warp.py
      - name: MCP server tests
        run: python test/test_mcp.py
      # Parses the tokens straight out of ui/index.html and fails on any contrast
      # regression that is not explicitly accepted in the script. Added in v0.9.3
      # because the previous audit lived beside the code with its OWN copy of the
      # palette, and was two releases stale before anyone noticed.
      - name: Contrast audit
        run: python scripts/contrast_audit.py
      - name: Realism pass tests (M2)
        run: python test/test_grade.py
      - name: Sidecar reproducibility
        run: python test/test_sidecar.py
      # The other half of reproducibility, and the half that broke: the sidecar
      # can record every parameter correctly and still be useless if the sweep
      # has deleted the source it names. test_sidecar.py checks the CONTENTS of
      # the recipe; this checks the ingredients are still there.
      - name: Session sweep retention
        run: python test/test_sweep.py
      # The contract that keeps the still and video paths from drifting: frame 0
      # of a render must equal the still composite byte for byte. It shares
      # Plan with compose(), and a refactor that split them would pass every
      # other suite here. ffmpeg comes from the imageio-ffmpeg wheel already in
      # requirements.txt; the suite skips itself if it is somehow absent.
      - name: Video path tests
        env:
          SCREENGRAFT_REQUIRE_FFMPEG: "1"
        run: python test/test_video.py
      # The render ROUTE, over HTTP, against a real server. test_video.py proves
      # the engine and touches none of this -- and all three defects that made
      # this file necessary lived in the route: a finished render never recorded
      # as the session output, a flag set before validation that locked
      # rendering for good, and a sidecar published before the encode. Each
      # would have passed every engine test in this directory.
      - name: Render route tests
        env:
          SCREENGRAFT_REQUIRE_FFMPEG: "1"
        run: python test/test_render_api.py
      # Static analysis. Scoped to the rules that catch real defects — undefined
      # names, unused imports, silently-truncating zip() — rather than style,
      # so a red CI always means something is actually wrong.
      - name: Lint
        run: |
          pip install ruff
          ruff check scripts/ test/ --select F,B905,RUF057,RUF059
      - name: Dead-code report (advisory)
        run: python scripts/deadcode.py
      # Nothing personal or project-local may ship. Scans the files the packager
      # includes, so it measures the artefact rather than the working tree.
      # The marketplace entry and plugin.json state the same facts in two
      # places; nothing else notices when they drift.
      - name: Marketplace catalog
        run: python scripts/check_marketplace.py
      # Reads the pack listing rather than trusting the config: npm's `files`
      # overrides .npmignore, and compiled bytecode carries absolute paths
      # past any text search. Both shipped in the first tarball built here.
      - name: npm package contents
        run: python scripts/check_package.py
      - name: Leak check
        run: python scripts/check_leaks.py
